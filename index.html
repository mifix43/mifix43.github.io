<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MIFIX — Games & Movies</title>

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="images/favicon.png">

    <!-- FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: "Inter", sans-serif;

            color: #E6F4FF;

            background: url("https://i.pinimg.com/originals/59/b2/34/59b2349684d902730f710b65f05ecb80.gif");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        header {
            position: relative;

            padding: 30px 20px;

            text-align: center;

            border-bottom: 1px solid rgba(143, 200, 255, 0.25);
        }

        header h1 {
            margin: 0;

            color: #E6F4FF;

            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.6px;
        }

        header p {
            margin: 10px 0 0;

            color: #C9DCEB;

            font-size: 15px;
            font-weight: 400;
        }

        /* MUSIC */

        .music-button {
            position: absolute;

            top: 20px;
            right: 20px;

            padding: 9px 14px;

            border: 1px solid rgba(143, 200, 255, 0.28);
            border-radius: 8px;

            color: #C9DCEB;
            background: rgba(8, 11, 16, 0.82);

            cursor: pointer;

            font-family: "Inter", sans-serif;
            font-size: 13px;
            font-weight: 600;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        .music-button:hover {
            border-color: rgba(143, 200, 255, 0.65);

            background: rgba(20, 27, 38, 0.92);

            box-shadow:
                0 0 12px rgba(143, 200, 255, 0.12);

            transform: translateY(-1px);
        }

        .music-button.active {
            color: #E6F4FF;

            border-color: rgba(143, 200, 255, 0.65);

            box-shadow:
                0 0 14px rgba(143, 200, 255, 0.15);
        }

        /* TABS */

        .tabs {
            display: flex;
            justify-content: center;

            gap: 10px;

            margin-top: 25px;
        }

        .tab-button,
        .subtitle-button,
        .sort-button {
            border: 1px solid rgba(143, 200, 255, 0.28);
            border-radius: 8px;

            padding: 10px 18px;

            color: #C9DCEB;
            background: rgba(8, 11, 16, 0.82);

            cursor: pointer;

            font-family: "Inter", sans-serif;
            font-size: 14px;
            font-weight: 600;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        .tab-button:hover,
        .subtitle-button:hover,
        .sort-button:hover {
            border-color: rgba(143, 200, 255, 0.65);

            background: rgba(20, 27, 38, 0.92);

            box-shadow:
                0 0 12px rgba(143, 200, 255, 0.12);

            transform: translateY(-1px);
        }

        .tab-button.active {
            color: #E6F4FF;

            background: rgba(60, 75, 95, 0.95);

            border-color: rgba(143, 200, 255, 0.65);

            box-shadow:
                0 0 14px rgba(143, 200, 255, 0.12);
        }

        .subtitle-button {
            margin-top: 15px;

            border: 1px solid transparent;

            background: transparent;
        }

        .counter {
            margin-top: 10px;

            color: #C9DCEB;

            font-size: 13px;
            font-weight: 500;
        }

        /* CONTAINER */

        .container {
            max-width: 900px;

            margin: 35px auto;

            padding: 0 20px;
        }

        /* TABS CONTENT */

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* CONTROLS */

        .controls {
            display: flex;

            justify-content: flex-end;

            margin-bottom: 15px;
        }

        /* LISTS */

        .games,
        .movies {
            display: flex;

            flex-direction: column;

            gap: 15px;
        }

        /* GAME / MOVIE CARD */

        .game,
        .movie {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 20px;

            padding: 15px;

            background: rgba(8, 11, 16, 0.88);

            border: 1px solid rgba(143, 200, 255, 0.24);

            border-radius: 12px;

            box-shadow:
                0 4px 18px rgba(0, 0, 0, 0.18);

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .game:hover,
        .movie:hover {
            transform: translateY(-3px);

            border-color: rgba(143, 200, 255, 0.62);

            box-shadow:
                0 8px 28px rgba(0, 0, 0, 0.35),
                0 0 16px rgba(143, 200, 255, 0.08);
        }

        /* INFO */

        .game-info,
        .movie-info {
            display: flex;

            align-items: center;

            gap: 18px;

            min-width: 0;
        }

        /* IMAGES */

        .game-image,
        .movie-image {
            width: 100px;
            height: 130px;

            flex-shrink: 0;

            object-fit: cover;

            border-radius: 8px;

            background: #202936;

            border: 1px solid rgba(143, 200, 255, 0.22);

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .game:hover .game-image,
        .movie:hover .movie-image {
            border-color: rgba(143, 200, 255, 0.55);

            box-shadow:
                0 0 12px rgba(143, 200, 255, 0.1);
        }

        /* NAMES */

        .game-name,
        .movie-name {
            color: #E6F4FF;

            font-size: 20px;
            font-weight: 700;

            line-height: 1.3;

            letter-spacing: -0.2px;
        }

        /* STEAM */

        .steam {
            display: block;

            margin-top: 8px;

            color: #8FC8FF;

            text-decoration: none;

            font-size: 13px;
            font-weight: 600;

            transition: color 0.2s ease;
        }

        .steam:hover {
            color: #B9DEFF;

            text-decoration: underline;
        }

        /* DESCRIPTION */

        .description {
            margin-top: 8px;

            color: #C9DCEB;

            font-size: 14px;
            font-weight: 400;

            line-height: 1.5;
        }

        /* RATING */

        .rating {
            min-width: 95px;

            padding: 10px 14px;

            border-radius: 8px;

            text-align: center;

            color: #E6F4FF;

            font-size: 32px;
            font-weight: 800;

            line-height: 1;

            letter-spacing: -1px;

            white-space: nowrap;
        }

        .rating span {
            font-size: 13px;
            font-weight: 600;

            letter-spacing: 0;

            opacity: 0.8;
        }

        /* GREEN */

        .rating.green {
            background: rgba(46, 204, 113, 0.25);

            color: #5CFF9A;

            border: 1px solid rgba(92, 255, 154, 0.22);

            box-shadow:
                0 0 18px rgba(46, 204, 113, 0.15);
        }

        /* YELLOW */

        .rating.yellow {
            background: rgba(241, 196, 15, 0.25);

            color: #FFE16B;

            border: 1px solid rgba(255, 225, 107, 0.22);

            box-shadow:
                0 0 18px rgba(241, 196, 15, 0.15);
        }

        /* RED */

        .rating.red {
            background: rgba(231, 76, 60, 0.25);

            color: #FF766B;

            border: 1px solid rgba(255, 118, 107, 0.22);

            box-shadow:
                0 0 18px rgba(231, 76, 60, 0.15);
        }

        /* EMPTY / LOADING */

        .empty,
        .loading {
            padding: 60px 20px;

            text-align: center;

            color: #C9DCEB;

            background: rgba(8, 11, 16, 0.88);

            border: 1px solid rgba(143, 200, 255, 0.24);

            border-radius: 12px;

            box-shadow:
                0 4px 18px rgba(0, 0, 0, 0.18);
        }

        /* SPINNER */

        .spinner {
            width: 32px;
            height: 32px;

            margin: 0 auto;

            border: 3px solid rgba(143, 200, 255, 0.2);

            border-top-color: #8FC8FF;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* FOOTER */

        footer {
            padding: 30px;

            text-align: center;

            color: #C9DCEB;

            font-size: 13px;
            font-weight: 400;
        }

        /* MASCOT */

        .mascot {
            position: fixed;

            right: 20px;
            bottom: -40px;

            width: 200px;
            height: 200px;

            z-index: 100;

            cursor: pointer;

            transition:
                bottom 0.3s ease,
                transform 0.3s ease,
                filter 0.3s ease;
        }

        .mascot:hover {
            bottom: 0;

            transform: scale(1.05);

            filter: drop-shadow(
                0 0 20px rgba(143, 200, 255, 0.5)
            );
        }

        .mascot img {
            width: 100%;
            height: 100%;

            object-fit: contain;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            header {
                padding: 25px 15px;
            }

            header h1 {
                font-size: 26px;
            }

            .music-button {
                position: static;

                margin-bottom: 15px;
            }

            .tabs {
                flex-wrap: wrap;
            }

            .tab-button,
            .subtitle-button,
            .sort-button {
                font-size: 13px;
            }

            .game,
            .movie {
                flex-direction: column;

                align-items: flex-start;
            }

            .game-info,
            .movie-info {
                width: 100%;
            }

            .rating {
                align-self: flex-end;
            }

            .game-image,
            .movie-image {
                width: 80px;
                height: 105px;
            }

            .game-name,
            .movie-name {
                font-size: 17px;
            }

            .description {
                font-size: 13px;
            }

            .mascot {
                width: 140px;
                height: 140px;

                right: 10px;
            }
        }
    </style>
</head>

<body>

<header>

    <!-- MUSIC BUTTON -->
    <button
        class="music-button"
        id="musicButton"
        type="button"
    >
        🎵 Музыка
    </button>

    <!-- TITLE -->
    <h1>MIFIX — Games & Movies</h1>

    <!-- SUBTITLE -->
    <button
        class="subtitle-button"
        id="subtitleBtn"
        type="button"
    >
        Мой личный рейтинг игр
    </button>

    <!-- COUNTER -->
    <div
        class="counter"
        id="counter"
    >
        Загрузка...
    </div>

    <!-- TABS -->
    <nav class="tabs">

        <button
            class="tab-button active"
            data-tab="games"
            type="button"
        >
            🎮 Games
        </button>

        <button
            class="tab-button"
            data-tab="movies"
            type="button"
        >
            🎬 Movies
        </button>

    </nav>

</header>


<main class="container">

    <!-- GAMES -->

    <section
        class="tab-content active"
        id="games-tab"
    >

        <div
            class="controls"
            id="controls"
        >
            <button
                class="sort-button"
                id="sortBtn"
                type="button"
            >
                Сортировка: по рейтингу
            </button>
        </div>

        <div
            class="games"
            id="games"
        ></div>

    </section>


    <!-- MOVIES -->

    <section
        class="tab-content"
        id="movies-tab"
    >

        <div
            class="controls"
            id="movies-controls"
        >
            <button
                class="sort-button"
                id="movies-sortBtn"
                type="button"
            >
                Сортировка: по рейтингу
            </button>
        </div>

        <div
            class="movies"
            id="movies"
        ></div>

    </section>

</main>


<!-- FOOTER -->

<footer>
    © 2026 MIFIX
</footer>


<!-- MASCOT -->

<a
    class="mascot"
    href="https://t.me/m1fixpixel"
    target="_blank"
    rel="noopener noreferrer"
    title="Перейти в Telegram"
>
    <img
        src="https://i.imgur.gg/ols7ZDd-image-removebg-preview.png"
        alt="MIFIX Mascot"
    >
</a>


<!-- BACKGROUND MUSIC -->

<audio
    id="backgroundMusic"
    loop
    preload="auto"
>
    <source
        src="music/Background2.mp3"
        type="audio/mpeg"
    >
</audio>


<!-- MUSIC SCRIPT -->

<script>
    const music = document.getElementById("backgroundMusic");
    const musicButton = document.getElementById("musicButton");

    musicButton.addEventListener("click", async () => {
        try {

            if (music.paused) {

                await music.play();

                musicButton.textContent = "🔊 Музыка включена";
                musicButton.classList.add("active");

            } else {

                music.pause();

                musicButton.textContent = "🎵 Музыка";
                musicButton.classList.remove("active");

            }

        } catch (error) {

            console.error(
                "Не удалось запустить музыку:",
                error
            );

        }
    });
</script>


<!-- APP -->

<script src="app.js"></script>

</body>
</html>
