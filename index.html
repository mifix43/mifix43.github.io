<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MIFIX — Games & Movies</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            color: #F5F7FA;

            background: url("https://i.pinimg.com/originals/59/b2/34/59b2349684d902730f710b65f05ecb80.gif");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        header {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin: 10px 0 0;
            color: #D8DEE7;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
        }

        .tab-button,
        .subtitle-button,
        .sort-button {
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 8px;

            padding: 10px 18px;

            color: #D8DEE7;
            background: rgba(8, 11, 16, 0.82);

            cursor: pointer;
            font-size: 14px;

            transition:
                background 0.2s,
                border-color 0.2s,
                transform 0.2s;
        }

        .tab-button:hover,
        .subtitle-button:hover,
        .sort-button:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(20, 27, 38, 0.9);
            transform: translateY(-1px);
        }

        .tab-button.active {
            color: #fff;
            background: rgba(60, 75, 95, 0.95);
            border-color: rgba(255, 255, 255, 0.45);
        }

        .subtitle-button {
            margin-top: 15px;
            border: 0;
            background: transparent;
        }

        .counter {
            margin-top: 10px;
            color: #D8DEE7;
            font-size: 14px;
        }

        .container {
            max-width: 900px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .controls {
            display: none;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .games,
        .movies {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .game,
        .movie {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            padding: 15px;

            background: rgba(8, 11, 16, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;

            transition:
                transform 0.2s,
                border-color 0.2s,
                box-shadow 0.2s;
        }

        .game:hover,
        .movie:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        .game-info,
        .movie-info {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .game-image,
        .movie-image {
            width: 100px;
            height: 130px;

            flex-shrink: 0;

            object-fit: cover;

            border-radius: 8px;

            background: #202936;
        }

        .game-name,
        .movie-name {
            color: #F5F7FA;
            font-size: 21px;
            font-weight: 700;
        }

        .steam {
            display: block;

            margin-top: 8px;

            color: #A9CFFF;
            text-decoration: none;

            font-size: 14px;
            font-weight: 700;
        }

        .steam:hover {
            color: #C5DEFF;
            text-decoration: underline;
        }

        .description {
            margin-top: 8px;
            color: #D8DEE7;
            font-size: 14px;
            line-height: 1.4;
        }

        .rating {
            min-width: 95px;

            padding: 10px 14px;

            border-radius: 8px;

            text-align: center;

            color: #fff;

            font-size: 32px;
            font-weight: 700;

            white-space: nowrap;
        }

        .rating span {
            font-size: 14px;
            font-weight: 700;
            opacity: 0.8;
        }

        .rating.green {
            background: rgba(46, 204, 113, 0.25);
            color: #5CFF9A;
            box-shadow: 0 0 18px rgba(46, 204, 113, 0.15);
        }

        .rating.yellow {
            background: rgba(241, 196, 15, 0.25);
            color: #FFE16B;
            box-shadow: 0 0 18px rgba(241, 196, 15, 0.15);
        }

        .rating.red {
            background: rgba(231, 76, 60, 0.25);
            color: #FF766B;
            box-shadow: 0 0 18px rgba(231, 76, 60, 0.15);
        }

        .empty,
        .loading {
            padding: 60px 20px;

            text-align: center;

            color: #D8DEE7;

            background: rgba(8, 11, 16, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
        }

        .spinner {
            width: 32px;
            height: 32px;

            margin: 0 auto;

            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #F5F7FA;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        footer {
            padding: 30px;

            text-align: center;

            color: #D8DEE7;
        }

        .mascot {
            position: fixed;

            right: 20px;
            bottom: -40px;

            width: 200px;
            height: 200px;

            z-index: 100;

            cursor: pointer;

            transition:
                bottom 0.3s ease,
                transform 0.3s ease,
                filter 0.3s ease;
        }

        .mascot:hover {
            bottom: 0;
            transform: scale(1.05);

            filter: drop-shadow(
                0 0 20px rgba(169, 207, 255, 0.5)
            );
        }

        .mascot img {
            width: 100%;
            height: 100%;

            object-fit: contain;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 26px;
            }

            .tabs {
                flex-wrap: wrap;
            }

            .game,
            .movie {
                flex-direction: column;
                align-items: flex-start;
            }

            .game-info,
            .movie-info {
                width: 100%;
            }

            .rating {
                align-self: flex-end;
            }

            .game-image,
            .movie-image {
                width: 80px;
                height: 105px;
            }

            .mascot {
                width: 140px;
                height: 140px;
                right: 10px;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>MIFIX — Games & Movies</h1>

    <button
        class="subtitle-button"
        id="subtitleBtn"
        type="button"
    >
        Мой личный рейтинг игр
    </button>

    <div
        class="counter"
        id="counter"
    >
        Загрузка...
    </div>

    <nav class="tabs">

        <button
            class="tab-button active"
            data-tab="games"
            type="button"
        >
            🎮 Games
        </button>

        <button
            class="tab-button"
            data-tab="movies"
            type="button"
        >
            🎬 Movies
        </button>

    </nav>

</header>


<main class="container">

    <section
        class="tab-content active"
        id="games-tab"
    >

        <div
            class="controls"
            id="controls"
        >
            <button
                class="sort-button"
                id="sortBtn"
                type="button"
            >
                Сортировка: по рейтингу
            </button>
        </div>

        <div
            class="games"
            id="games"
        ></div>

    </section>


    <section
        class="tab-content"
        id="movies-tab"
    >

        <div
            class="controls"
            id="movies-controls"
        >
            <button
                class="sort-button"
                id="movies-sortBtn"
                type="button"
            >
                Сортировка: по рейтингу
            </button>
        </div>

        <div
            class="movies"
            id="movies"
        ></div>

    </section>

</main>


<footer>
    © 2026 MIFIX
</footer>


<a
    class="mascot"
    href="https://t.me/m1fixpixel"
    target="_blank"
    rel="noopener noreferrer"
    title="Перейти в Telegram"
>
    <img
        src="https://i.imgur.gg/ols7ZDd-image-removebg-preview.png"
        alt="MIFIX Mascot"
    >
</a>


<script src="app.js"></script>

</body>
</html>
