<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MIFIX — Steam Ratings</title>

    <!-- Подключаем мягкий, читабельный шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --text: #E8F3F8;        /* основной светлый текст, мягче, чем раньше */
            --muted: #C7D6E0;       /* приглушённый текст */
            --accent: #A9CFFF;      /* акцентный цвет (синий) */
            --card-bg: rgba(8, 11, 16, 0.88);
            --glass: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            margin: 0;
            min-height: 100vh;

            color: var(--text);

            background: #2A7B9B;
            background: linear-gradient(
                90deg,
                rgba(42, 123, 155, 1) 0%,
                rgba(87, 199, 133, 1) 50%,
                rgba(237, 221, 83, 1) 100%
            );
        }

        header {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        header h1 {
            margin: 0;
            color: var(--text);
            font-size: 32px;
            font-weight: 600;
        }

        .header-subtitle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            color: var(--muted);
            font-weight: 400;
        }

        .game-count {
            display: inline-block;
            background: var(--glass);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--accent);
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .sort-button {
            padding: 8px 16px;
            background: rgba(169, 207, 255, 0.15);
            border: 1px solid rgba(169, 207, 255, 0.35);
            color: var(--accent);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .sort-button:hover {
            background: rgba(169, 207, 255, 0.28);
            border-color: rgba(169, 207, 255, 0.6);
        }

        .games {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .game {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            padding: 15px;

            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;

            transition:
                transform 0.2s,
                border-color 0.2s,
                box-shadow 0.2s;

            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 24px rgba(42, 123, 155, 0.25);
        }

        .game-info {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .game-image {
            width: 100px;
            height: 130px;

            object-fit: cover;

            border-radius: 8px;

            background: #202936;
        }

        .game-name {
            color: var(--text);
            font-size: 21px;
            font-weight: 600;
        }

        .steam {
            display: block;

            margin-top: 8px;

            color: var(--accent);
            text-decoration: none;

            font-size: 14px;
        }

        .steam:hover {
            color: #C5DEFF;
            text-decoration: underline;
        }

        .rating {
            color: var(--text);
            font-size: 35px;
            font-weight: 700;
            white-space: nowrap;

            padding: 10px 16px;
            background: rgba(169, 207, 255, 0.08);
            border-radius: 8px;

            transition:
                box-shadow 0.2s,
                background 0.2s;
        }

        .rating span {
            color: var(--muted);
            font-size: 15px;
            font-weight: 400;
        }

        .game:hover .rating {
            background: rgba(169, 207, 255, 0.18);
            box-shadow: 0 0 16px rgba(169, 207, 255, 0.2);
        }

        .loading {
            padding: 40px 20px;

            text-align: center;

            color: var(--muted);

            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(169, 207, 255, 0.18);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty {
            padding: 70px 20px;

            text-align: center;

            color: var(--muted);

            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
        }

        footer {
            padding: 30px;

            text-align: center;

            color: var(--muted);
        }

        @media (max-width: 600px) {

            .game {
                flex-direction: column;
                align-items: flex-start;
            }

            .game-info {
                width: 100%;
            }

            .rating {
                align-self: flex-end;
            }

            .game-image {
                width: 80px;
                height: 105px;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .sort-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>MIFIX — Steam Ratings</h1>
    <div class="header-subtitle">
        <span>Мой личный рейтинг игр</span>
        <span class="game-count" id="counter">0 игр</span>
    </div>
</header>

<main class="container">
    <div class="controls" id="controls" style="display: none;">
        <button class="sort-button" id="sortBtn">Сортировка: по рейтингу ⬇️</button>
    </div>
    <div class="games" id="games"></div>
</main>

<footer>
    © 2026 MIFIX
</footer>

<script>
    const gamesContainer = document.getElementById("games");
    const counterElement = document.getElementById("counter");
    const controlsElement = document.getElementById("controls");
    const sortBtn = document.getElementById("sortBtn");

    let gamesData = [];
    let isSorted = false;

    function renderGames(games) {
        gamesContainer.innerHTML = games.map(game => `
            <article class="game">

                <div class="game-info">

                    ${
                        game.image
                            ? `
                                <img
                                    class="game-image"
                                    src="${game.image}"
                                    alt="${game.name}"
                                >
                            `
                            : `
                                <div class="game-image"></div>
                            `
                    }

                    <div>

                        <div class="game-name">
                            ${game.name}
                        </div>

                        ${
                            game.steam
                                ? `
                                    <a
                                        class="steam"
                                        href="${game.steam}"
                                        target="_blank"
                                        rel="noopener"
                                    >
                                        Открыть в Steam ↗
                                    </a>
                                `
                                : ""
                        }

                    </div>

                </div>

                <div class="rating">
                    ${game.rating}
                    <span>/10</span>
                </div>

            </article>
        `).join("");
    }

    function updateCounter(count) {
        const plural = count % 10 === 1 && count % 100 !== 11 ? 'игра' : 'игр';
        counterElement.textContent = `${count} ${plural}`;
    }

    function toggleSort() {
        isSorted = !isSorted;
        const sorted = isSorted 
            ? [...gamesData].sort((a, b) => b.rating - a.rating)
            : gamesData;
        
        sortBtn.textContent = isSorted 
            ? 'Сортировка: по рейтингу ⬇️' 
            : 'Сортировка: оригинальный порядок';
        
        renderGames(sorted);
    }

    // Показать загрузку
    gamesContainer.innerHTML = `
        <div class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px;">Загрузка игр...</p>
        </div>
    `;

    fetch("games.json")
        .then(response => {
            if (!response.ok) {
                throw new Error("Не удалось загрузить games.json");
            }

            return response.json();
        })
        .then(games => {
            if (!games.length) {
                gamesContainer.innerHTML = `
                    <div class="empty">
                        Пока игр нет 🎮
                    </div>
                `;
                updateCounter(0);
                return;
            }

            gamesData = games;
            updateCounter(games.length);
            renderGames(games);
            controlsElement.style.display = 'flex';

            sortBtn.addEventListener('click', toggleSort);
        })
        .catch(error => {
            console.error(error);

            gamesContainer.innerHTML = `
                <div class="empty">
                    Не удалось загрузить список игр.
                </div>
            `;
        });
</script>

</body>
</html>
