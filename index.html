<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIFIX — Steam Ratings</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080b10;
            color: #fff;
        }

        header {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid #222b38;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin-top: 10px;
            color: #8995a5;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .games {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .game {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            padding: 15px;

            background: #121923;
            border: 1px solid #283342;
            border-radius: 12px;

            transition: transform 0.2s, border-color 0.2s;
        }

        .game:hover {
            transform: translateY(-2px);
            border-color: #3d5068;
        }

        .game-info {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .game-image {
            width: 100px;
            height: 130px;
            object-fit: cover;
            border-radius: 8px;
            background: #202936;
        }

        .game-name {
            font-size: 21px;
            font-weight: bold;
        }

        .steam {
            display: block;
            margin-top: 8px;
            color: #66a3ff;
            text-decoration: none;
            font-size: 14px;
        }

        .steam:hover {
            text-decoration: underline;
        }

        .rating {
            font-size: 35px;
            font-weight: bold;
            white-space: nowrap;
        }

        .rating span {
            color: #788595;
            font-size: 15px;
            font-weight: normal;
        }

        .empty {
            padding: 70px 20px;
            text-align: center;
            color: #657184;

            background: #121923;
            border: 1px solid #283342;
            border-radius: 12px;
        }

        footer {
            padding: 30px;
            text-align: center;
            color: #657184;
        }

        @media (max-width: 600px) {
            .game {
                flex-direction: column;
                align-items: flex-start;
            }

            .game-info {
                width: 100%;
            }

            .rating {
                align-self: flex-end;
            }

            .game-image {
                width: 80px;
                height: 105px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>MIFIX — Steam Ratings</h1>
    <p>Мой личный рейтинг игр</p>
</header>

<main class="container">
    <div class="games" id="games"></div>
</main>

<footer>
    © 2026 MIFIX
</footer>

<script>
    const gamesContainer = document.getElementById("games");

    fetch("games.json")
        .then(response => response.json())
        .then(games => {
            if (!games.length) {
                gamesContainer.innerHTML = `
                    <div class="empty">
                        Пока игр нет 🎮
                    </div>
                `;
                return;
            }

            gamesContainer.innerHTML = games.map(game => `
                <article class="game">
                    <div class="game-info">
                        ${
                            game.image
                                ? `<img class="game-image" src="${game.image}" alt="${game.name}">`
                                : `<div class="game-image"></div>`
                        }

                        <div>
                            <div class="game-name">${game.name}</div>

                            ${
                                game.steam
                                    ? `<a class="steam" href="${game.steam}" target="_blank" rel="noopener">
                                        Открыть в Steam ↗
                                    </a>`
                                    : ""
                            }
                        </div>
                    </div>

                    <div class="rating">
                        ${game.rating}<span>/10</span>
                    </div>
                </article>
            `).join("");
        })
        .catch(() => {
            gamesContainer.innerHTML = `
                <div class="empty">
                    Не удалось загрузить список игр.
                </div>
            `;
        });
</script>

</body>
</html>
