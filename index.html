<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MIFIX — Steam Ratings</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080b10;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid #222b38;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            color: #8995a5;
            margin-top: 10px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .games {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .game {
            display: flex;
            align-items: center;
            justify-content: space-between;

            background: #121923;
            border: 1px solid #283342;
            border-radius: 12px;

            padding: 15px;

            transition: 0.2s;
        }

        .game:hover {
            border-color: #3d5068;
            transform: translateY(-2px);
        }

        .game-info {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .game-image {
            width: 100px;
            height: 130px;

            object-fit: cover;

            border-radius: 8px;

            background: #202936;
        }

        .game-name {
            font-size: 21px;
            font-weight: bold;
        }

        .steam {
            display: block;

            margin-top: 8px;

            color: #66a3ff;
            text-decoration: none;

            font-size: 14px;
        }

        .steam:hover {
            text-decoration: underline;
        }

        .rating {
            font-size: 35px;
            font-weight: bold;
            white-space: nowrap;
        }

        .rating span {
            color: #788595;
            font-size: 15px;
            font-weight: normal;
        }

        .empty {
            text-align: center;

            color: #657184;

            padding: 70px 20px;

            background: #121923;

            border: 1px solid #283342;
            border-radius: 12px;
        }

        footer {
            text-align: center;

            color: #657184;

            padding: 30px;
        }


        /* Телефон */

        @media (max-width: 600px) {

            .game {
                flex-direction: column;
                align-items: flex-start;

                gap: 15px;
            }

            .game-info {
                width: 100%;
            }

            .rating {
                align-self: flex-end;
            }

            .game-image {
                width: 80px;
                height: 105px;
            }
        }

    </style>
</head>


<body>


<header>

    <h1>
        MIFIX — Steam Ratings
    </h1>

    <p>
        Мой личный рейтинг игр
    </p>

</header>


<div class="container">

    <div
        class="games"
        id="games"
    ></div>

</div>


<footer>

    © 2026 MIFIX

</footer>


<script>

    /*
        Загружаем игры из games.json
    */

    fetch("games.json")

        .then(response => {

            if (!response.ok) {
                throw new Error("Не удалось загрузить games.json");
            }

            return response.json();

        })

        .then(games => {

            const container =
                document.getElementById("games");


            /*
                Если игр нет
            */

            if (
                !games ||
                games.length === 0
            ) {

                container.innerHTML = `

                    <div class="empty">

                        Пока игр нет 🎮

                    </div>

                `;

                return;
            }


            /*
                Создаём карточки игр
            */

            games.forEach(game => {

                const element =
                    document.createElement("div");


                element.className = "game";


                element.innerHTML = `

                    <div class="game-info">


                        ${
                            game.image
                            ?
                            `
                            <img
                                class="game-image"
                                src="${game.image}"
                                alt="${game.name}"
                            >
                            `
                            :
                            `
                            <div
                                class="game-image"
                            ></div>
                            `
                        }


                        <div>

                            <div class="game-name">

                                ${game.name}

                            </div>


                            ${
                                game.steam
                                ?
                                `
                                <a
                                    class="steam"
                                    href="${game.steam}"
                                    target="_blank"
                                    rel="noopener"
                                >
                                    Открыть в Steam ↗
                                </a>
                                `
                                :
                                ""
                            }

                        </div>

                    </div>


                    <div class="rating">

                        ${game.rating}

                        <span>
                            /10
                        </span>

                    </div>

                `;


                container.appendChild(element);

            });

        })


        /*
            Если произошла ошибка
        */

        .catch(error => {

            console.error(error);

            document.getElementById("games").innerHTML = `

                <div class="empty">

                    Не удалось загрузить список игр.

                </div>

            `;

        });

</script>


</body>
</html>
