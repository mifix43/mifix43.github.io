<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MIFIX — Steam Ratings</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: #F5F7FA;

            background: #2A7B9B;
            background: linear-gradient(
                90deg,
                rgba(42, 123, 155, 1) 0%,
                rgba(87, 199, 133, 1) 50%,
                rgba(237, 221, 83, 1) 100%
            );
        }

        header {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        header h1 {
            margin: 0;
            color: #F5F7FA;
            font-size: 32px;
        }

        header p {
            margin-top: 10px;
            color: #D8DEE7;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .games {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .game {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            padding: 15px;

            background: rgba(8, 11, 16, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;

            transition:
                transform 0.2s,
                border-color 0.2s;
        }

        .game:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .game-info {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .game-image {
            width: 100px;
            height: 130px;

            object-fit: cover;
            border-radius: 8px;

            background: #202936;
        }

        .game-name {
            color: #F5F7FA;
            font-size: 21px;
            font-weight: bold;
        }

        .description {
            margin-top: 8px;
            color: #D8DEE7;
            font-size: 14px;
            line-height: 1.4;
        }

        .steam {
            display: block;
            margin-top: 8px;

            color: #A9CFFF;
            text-decoration: none;
            font-size: 14px;
        }

        .steam:hover {
            color: #C5DEFF;
            text-decoration: underline;
        }

        .rating {
            color: #F5F7FA;
            font-size: 35px;
            font-weight: bold;
            white-space: nowrap;
        }

        .rating span {
            color: #B8C1CC;
            font-size: 15px;
            font-weight: normal;
        }

        .empty {
            padding: 70px 20px;

            text-align: center;
            color: #D8DEE7;

            background: rgba(8, 11, 16, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
        }

        footer {
            padding: 30px;
            text-align: center;
            color: #D8DEE7;
        }

        @media (max-width: 600px) {
            .game {
                flex-direction: column;
                align-items: flex-start;
            }

            .game-info {
                width: 100%;
            }

            .rating {
                align-self: flex-end;
            }

            .game-image {
                width: 80px;
                height: 105px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>MIFIX — Steam Ratings</h1>
    <p>Мой личный рейтинг игр</p>
</header>

<main class="container">
    <div class="games" id="games"></div>
</main>

<footer>
    © 2026 MIFIX
</footer>

<script>
    const gamesContainer = document.getElementById("games");

    fetch("games.json")
        .then(response => {
            if (!response.ok) {
                throw new Error("Не удалось загрузить games.json");
            }

            return response.json();
        })
        .then(games => {
            if (!games.length) {
                gamesContainer.innerHTML = `
                    <div class="empty">
                        Пока игр нет 🎮
                    </div>
                `;

                return;
            }

            gamesContainer.innerHTML = games.map(game => `
                <article class="game">

                    <div class="game-info">

                        ${
                            game.image
                                ? `
                                    <img
                                        class="game-image"
                                        src="${game.image}"
                                        alt="${game.name}"
                                    >
                                `
                                : `
                                    <div class="game-image"></div>
                                `
                        }

                        <div>

                            <div class="game-name">
                                ${game.name}
                            </div>

                            ${
                                game.description
                                    ? `
                                        <div class="description">
                                            ${game.description}
                                        </div>
                                    `
                                    : ""
                            }

                            ${
                                game.steam
                                    ? `
                                        <a
                                            class="steam"
                                            href="${game.steam}"
                                            target="_blank"
                                            rel="noopener"
                                        >
                                            Открыть в Steam ↗
                                        </a>
                                    `
                                    : ""
                            }

                        </div>

                    </div>

                    <div class="rating">
                        ${game.rating}
                        <span>/10</span>
                    </div>

                </article>
            `).join("");
        })
        .catch(error => {
            console.error(error);

            gamesContainer.innerHTML = `
                <div class="empty">
                    Не удалось загрузить список игр.
                </div>
            `;
        });
</script>

</body>
</html>
