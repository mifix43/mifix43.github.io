<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MIFIX — Steam Ratings</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: #F5F7FA;

            background: url("https://i.pinimg.com/originals/59/b2/34/59b2349684d902730f710b65f05ecb80.gif");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        header {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        header h1 {
            margin: 0;
            color: #F5F7FA;
            font-size: 32px;
        }

        header p {
            margin-top: 10px;
            color: #D8DEE7;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .games {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .game {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            padding: 15px;

            background: rgba(8, 11, 16, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;

            transition:
                transform 0.2s,
                border-color 0.2s,
                box-shadow 0.2s;
        }

        .game:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        .game-info {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .game-image {
            width: 100px;
            height: 130px;
            object-fit: cover;
            border-radius: 8px;
            background: #202936;
        }

        .game-name {
            color: #F5F7FA;
            font-size: 21px;
            font-weight: 700;
        }

        .description {
            margin-top: 8px;
            color: #D8DEE7;
            font-size: 14px;
            line-height: 1.4;
        }

        .steam {
            display: block;
            margin-top: 8px;

            color: #A9CFFF;
            text-decoration: none;

            font-size: 14px;
            font-weight: 700;
        }

        .steam:hover {
            color: #C5DEFF;
            text-decoration: underline;
        }

        .rating {
            padding: 10px 16px;

            color: #F5F7FA;
            font-size: 35px;
            font-weight: 700;
            white-space: nowrap;

            background: rgba(169, 207, 255, 0.1);
            border-radius: 8px;

            transition:
                box-shadow 0.2s,
                background 0.2s;
        }

        .rating span {
            color: #B8C1CC;
            font-size: 15px;
            font-weight: 700;
        }

        .game:hover .rating {
            background: rgba(169, 207, 255, 0.2);
            box-shadow: 0 0 16px rgba(169, 207, 255, 0.25);
        }

        .empty {
            padding: 70px 20px;

            text-align: center;
            color: #D8DEE7;

            background: rgba(8, 11, 16, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
        }

        footer {
            padding: 30px;
            text-align: center;
            color: #D8DEE7;
        }

        .mascot {
            position: fixed;
            right: 20px;
            bottom: -40px;

            width: 200px;
            height: 200px;

            cursor: pointer;
            z-index: 100;

            transition:
                bottom 0.3s ease,
                transform 0.3s ease,
                filter 0.3s ease;
        }

        .mascot:hover {
            bottom: 0;
            transform: scale(1.05);

            filter: drop-shadow(
                0 0 20px rgba(169, 207, 255, 0.5)
            );
        }

        .mascot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @media (max-width: 600px) {
            .game {
                flex-direction: column;
                align-items: flex-start;
            }

            .game-info {
                width: 100%;
            }

            .rating {
                align-self: flex-end;
            }

            .game-image {
                width: 80px;
                height: 105px;
            }

            .mascot {
                width: 140px;
                height: 140px;
                right: 10px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>MIFIX — Steam Ratings</h1>
    <p>Мой личный рейтинг игр</p>
</header>

<main class="container">
    <div class="games" id="games"></div>
</main>

<footer>
    © 2026 MIFIX
</footer>

<a
    href="https://t.me/m1fixpixel"
    target="_blank"
    rel="noopener"
    class="mascot"
    title="Перейти в Telegram"
>
    <img
        src="https://i.imgur.gg/ols7ZDd-image-removebg-preview.png"
        alt="MIFIX Mascot"
    >
</a>

<script>
    const gamesContainer = document.getElementById("games");

    fetch("games.json")
        .then(response => {
            if (!response.ok) {
                throw new Error("Не удалось загрузить games.json");
            }

            return response.json();
        })
        .then(games => {
            if (!games.length) {
                gamesContainer.innerHTML = `
                    <div class="empty">
                        Пока игр нет 🎮
                    </div>
                `;

                return;
            }

            gamesContainer.innerHTML = games.map(game => `
                <article class="game">

                    <div class="game-info">

                        ${
                            game.image
                                ? `
                                    <img
                                        class="game-image"
                                        src="${game.image}"
                                        alt="${game.name}"
                                    >
                                `
                                : `
                                    <div class="game-image"></div>
                                `
                        }

                        <div>

                            <div class="game-name">
                                ${game.name}
                            </div>

                            ${
                                game.description
                                    ? `
                                        <div class="description">
                                            ${game.description}
                                        </div>
                                    `
                                    : ""
                            }

                            ${
                                game.steam
                                    ? `
                                        <a
                                            class="steam"
                                            href="${game.steam}"
                                            target="_blank"
                                            rel="noopener"
                                        >
                                            Открыть в Steam ↗
                                        </a>
                                    `
                                    : ""
                            }

                        </div>

                    </div>

                    <div class="rating">
                        ${game.rating}<span>/10</span>
                    </div>

                </article>
            `).join("");
        })
        .catch(error => {
            console.error(error);

            gamesContainer.innerHTML = `
                <div class="empty">
                    Не удалось загрузить список игр.
                </div>
            `;
        });
</script>

</body>
</html>
