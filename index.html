<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MIFIX — Ratings</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            color: #F5F7FA;

            background: linear-gradient(rgba(48, 58, 80, 0.8), rgba(48, 58, 80, 0.8)), url('https://i.pinimg.com/originals/59/b2/34/59b2349684d902730f710b65f05ecb80.gif');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }

        header {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        header h1 {
            margin: 0;
            color: #F5F7FA;
            font-size: 32px;
        }

        .header-subtitle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            color: #D8DEE7;
        }

        .game-count {
            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            color: #A9CFFF;
        }

        /* Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .tab-button {
            padding: 10px 20px;
            background: rgba(169, 207, 255, 0.1);
            border: 1px solid rgba(169, 207, 255, 0.3);
            color: #A9CFFF;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.2s;
        }

        .tab-button:hover {
            background: rgba(169, 207, 255, 0.2);
        }

        .tab-button.active {
            background: rgba(169, 207, 255, 0.4);
            border-color: rgba(169, 207, 255, 0.8);
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .sort-button {
            padding: 8px 16px;
            background: rgba(169, 207, 255, 0.2);
            border: 1px solid rgba(169, 207, 255, 0.4);
            color: #A9CFFF;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.2s;
        }

        .sort-button:hover {
            background: rgba(169, 207, 255, 0.35);
            border-color: rgba(169, 207, 255, 0.6);
        }

        .games, .movies {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .game, .movie {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 15px;
            background: rgba(8, 11, 16, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            animation: slideIn 0.4s ease-out;
            cursor: pointer;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game:hover, .movie:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 24px rgba(42, 123, 155, 0.4);
        }

        .game-info, .movie-info {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .game-image, .movie-image {
            width: 100px;
            height: 130px;
            object-fit: cover;
            border-radius: 8px;
            background: #202936;
        }

        .game-name, .movie-name {
            color: #F5F7FA;
            font-size: 21px;
            font-weight: 700;
        }

        .steam {
            display: block;
            margin-top: 8px;
            color: #A9CFFF;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
        }

        .steam:hover {
            color: #C5DEFF;
            text-decoration: underline;
        }

        .rating {
            color: #F5F7FA;
            font-size: 35px;
            font-weight: 700;
            white-space: nowrap;
            padding: 10px 16px;
            border-radius: 8px;
            transition: box-shadow 0.2s, background 0.2s, transform 0.2s;
        }

        .rating span {
            color: #B8C1CC;
            font-size: 15px;
            font-weight: 700;
        }

        .rating.green {
            background: linear-gradient(135deg, #66BB6A, #4CAF50);
            box-shadow: 0 0 12px rgba(76, 175, 80, 0.3);
        }

        .rating.green:hover {
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
            transform: scale(1.05);
        }

        .rating.yellow {
            background: linear-gradient(135deg, #FDD835, #FBC02D);
            box-shadow: 0 0 12px rgba(251, 192, 45, 0.3);
            color: #000;
        }

        .rating.yellow:hover {
            box-shadow: 0 0 20px rgba(251, 192, 45, 0.5);
            transform: scale(1.05);
        }

        .rating.yellow span {
            color: #000;
        }

        .rating.red {
            background: linear-gradient(135deg, #EF5350, #E53935);
            box-shadow: 0 0 12px rgba(229, 57, 53, 0.3);
        }

        .rating.red:hover {
            box-shadow: 0 0 20px rgba(229, 57, 53, 0.5);
            transform: scale(1.05);
        }

        .loading {
            padding: 40px 20px;
            text-align: center;
            color: #D8DEE7;
            background: rgba(8, 11, 16, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-weight: 700;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(169, 207, 255, 0.2);
            border-top-color: #A9CFFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty {
            padding: 70px 20px;
            text-align: center;
            color: #D8DEE7;
            background: rgba(8, 11, 16, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-weight: 700;
        }

        footer {
            padding: 30px;
            text-align: center;
            color: #D8DEE7;
            font-weight: 700;
        }

        .mascot {
            position: fixed;
            bottom: -40px;
            right: 20px;
            width: 200px;
            height: 200px;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .mascot:hover {
            bottom: 0px;
            transform: scale(1.05);
            filter: drop-shadow(0 0 20px rgba(169, 207, 255, 0.5));
        }

        .mascot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s;
        }

        .modal.open {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: rgba(8, 11, 16, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
            position: relative;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: #D8DEE7;
            font-size: 28px;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #F5F7FA;
        }

        .modal-title {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 20px 0;
            color: #F5F7FA;
        }

        .review-section {
            margin-bottom: 25px;
        }

        .review-label {
            font-size: 16px;
            font-weight: 700;
            color: #A9CFFF;
            margin-bottom: 10px;
        }

        .star-rating {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .stars {
            display: flex;
            gap: 5px;
        }

        .star {
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s;
            user-select: none;
        }

        .star:hover {
            transform: scale(1.2);
        }

        .star.filled {
            color: #FFD700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .star.empty {
            color: rgba(255, 255, 255, 0.2);
        }

        .rating-value {
            color: #FFD700;
            font-weight: 700;
            font-size: 14px;
            min-width: 50px;
        }

        .hours-section {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #A9CFFF;
        }

        .hours-value {
            color: #A9CFFF;
            font-size: 20px;
            font-weight: 700;
        }

        .recommendation {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        .recommendation-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #D8DEE7;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            font-weight: 700;
        }

        .recommendation-btn:hover {
            transform: scale(1.05);
        }

        .recommendation-btn.recommended {
            background: rgba(76, 175, 80, 0.2);
            border-color: #4CAF50;
            color: #81C784;
        }

        .recommendation-btn.not-recommended {
            background: rgba(229, 57, 53, 0.2);
            border-color: #E53935;
            color: #EF5350;
        }

        .thumb {
            font-size: 32px;
        }

        /* Tab content */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media (max-width: 600px) {
            .game, .movie {
                flex-direction: column;
                align-items: flex-start;
            }

            .game-info, .movie-info {
                width: 100%;
            }

            .rating {
                align-self: flex-end;
            }

            .game-image, .movie-image {
                width: 80px;
                height: 105px;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .sort-button {
                width: 100%;
            }

            .mascot {
                width: 140px;
                height: 140px;
                right: 10px;
            }

            .modal-content {
                padding: 20px;
                width: 95%;
            }

            .tabs {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>MIFIX — Ratings</h1>
    <div class="header-subtitle">
        <span id="tabSubtitle">Мой личный рейтинг игр</span>
        <span class="game-count" id="counter">0 игр</span>
    </div>
</header>

<div class="tabs">
    <button class="tab-button active" data-tab="games">🎮 Games</button>
    <button class="tab-button" data-tab="movies">🎬 Movies</button>
</div>

<main class="container">
    <!-- Games Tab -->
    <div class="tab-content active" id="games-tab">
        <div class="controls" id="controls" style="display: none;">
            <button class="sort-button" id="sortBtn">Сортировка: по рейтингу ⬇️</button>
        </div>
        <div class="games" id="games"></div>
    </div>

    <!-- Movies Tab -->
    <div class="tab-content" id="movies-tab">
        <div class="controls" id="movies-controls" style="display: none;">
            <button class="sort-button" id="movies-sortBtn">Сортировка: по рейтингу ⬇️</button>
        </div>
        <div class="movies" id="movies"></div>
    </div>
</main>

<footer>
    © 2026 MIFIX
</footer>

<a href="https://t.me/m1fixpixel" target="_blank" rel="noopener" class="mascot" title="Перейти в Telegram">
    <img src="https://i.imgur.gg/ols7ZDd-image-removebg-preview.png" alt="MIFIX Mascot">
</a>

<!-- Modal -->
<div class="modal" id="modal">
    <div class="modal-content">
        <button class="modal-close" id="modalClose">&times;</button>
        <h2 class="modal-title" id="modalTitle"></h2>
        
        <div class="review-section">
            <div class="review-label">📺 Графика</div>
            <div class="star-rating" id="graphicsRating">
                <div class="stars"></div>
            </div>
        </div>

        <div class="review-section">
            <div class="review-label">📖 Сюжет</div>
            <div class="star-rating" id="storyRating">
                <div class="stars"></div>
            </div>
        </div>

        <div class="review-section">
            <div class="review-label">🎵 Музыка</div>
            <div class="star-rating" id="musicRating">
                <div class="stars"></div>
            </div>
        </div>

        <div class="review-section">
            <div class="review-label">🎮 Геймплей</div>
            <div class="star-rating" id="gameplayRating">
                <div class="stars"></div>
            </div>
        </div>

        <div class="review-section">
            <div class="review-label">⭐ Общая оценка</div>
            <div class="star-rating" id="overallRating">
                <div class="stars"></div>
            </div>
        </div>

        <div class="review-section">
            <div class="review-label">⏱️ Часов сыграно</div>
            <div class="hours-section" id="hoursSection">
                <span class="hours-value" id="hoursValue">0</span>
                <span>часов</span>
            </div>
        </div>

        <div class="review-section">
            <div class="review-label">💭 Рекомендация</div>
            <div class="recommendation">
                <button class="recommendation-btn" id="recommendBtn" data-type="recommend">
                    <span class="thumb">👍</span>
                    <span>Рекомендую</span>
                </button>
                <button class="recommendation-btn" id="notRecommendBtn" data-type="not-recommend">
                    <span class="thumb">👎</span>
                    <span>Не рекомендую</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>

</body>
</html>
